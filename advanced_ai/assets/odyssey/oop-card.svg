<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Courier New',monospace">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#1d2a5c"/><stop offset=".55" stop-color="#0d1838"/><stop offset="1" stop-color="#070d22"/>
    </radialGradient>
    <linearGradient id="neb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0"/><stop offset=".5" stop-color="#a855f7" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15336b"/><stop offset="1" stop-color="#0b1c40"/></linearGradient>
    <linearGradient id="scrA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".6" stop-color="#6d28d9"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <linearGradient id="scrB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#064e3b"/><stop offset=".6" stop-color="#0e7490"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="link" x1="0" x2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="#3b82f6" stroke-opacity=".22" stroke-width=".7"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>
  <path d="M-40 60 C 160 160, 360 120, 640 360" stroke="url(#neb)" stroke-width="140" fill="none"/>
  <g fill="#cfe6ff" opacity=".75">
    <circle cx="40" cy="34" r="1.2"/><circle cx="118" cy="372" r=".9"/><circle cx="214" cy="26" r="1"/><circle cx="292" cy="384" r="1.3"/>
    <circle cx="372" cy="22" r=".8"/><circle cx="560" cy="44" r="1.2"/><circle cx="578" cy="196" r=".9"/><circle cx="22" cy="214" r="1"/>
    <circle cx="452" cy="380" r="1"/><circle cx="520" cy="300" r=".7"/><circle cx="76" cy="300" r=".8"/><circle cx="330" cy="200" r=".6"/>
  </g>

  <!-- the class: a UML blueprint -->
  <g transform="translate(46,74)" filter="url(#glow)">
    <rect width="220" height="252" rx="12" fill="url(#bp)" stroke="#60a5fa" stroke-width="1.6"/>
    <rect width="220" height="252" rx="12" fill="url(#grid)"/>
    <text x="110" y="32" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">MobilePhone</text>
    <line x1="12" y1="46" x2="208" y2="46" stroke="#60a5fa"/>
    <g fill="#cfe0ff" font-size="13.5">
      <text x="20" y="70">+ color : str</text>
      <text x="20" y="91">+ model : str</text>
      <text x="20" y="112">+ brand : str</text>
      <text x="20" y="133">+ battery : int</text>
      <text x="20" y="154">+ is_on : bool</text>
    </g>
    <line x1="12" y1="170" x2="208" y2="170" stroke="#60a5fa"/>
    <g fill="#fbbf24" font-size="13.5">
      <text x="20" y="196">+ __init__(...)</text>
      <text x="20" y="218">+ __str__() : str</text>
      <text x="20" y="240">+ add(x, y)</text>
    </g>
  </g>

  <!-- class → objects -->
  <g stroke="url(#link)" stroke-width="2" fill="none" stroke-dasharray="5 6" opacity=".9">
    <path d="M272 168 C 320 150, 340 120, 372 112"/>
    <path d="M272 238 C 330 262, 410 280, 452 262"/>
  </g>
  <circle cx="272" cy="168" r="4" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="272" cy="238" r="4" fill="#fbbf24" filter="url(#glow)"/>

  <!-- object 1 -->
  <g transform="translate(372,54) rotate(-6)" filter="url(#glow)">
    <rect width="78" height="150" rx="14" fill="#1f2430" stroke="#9fb4e6" stroke-width="1.6"/>
    <rect x="6" y="8" width="66" height="134" rx="10" fill="url(#scrA)"/>
    <rect x="31" y="12" width="16" height="4" rx="2" fill="#0a0f1d"/>
    <text x="39" y="72" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" font-family="Segoe UI,sans-serif">12:30</text>
    <rect x="44" y="22" width="20" height="8" rx="2" fill="none" stroke="#e7ecff" stroke-width="1"/>
    <rect x="45.5" y="23.5" width="14" height="5" rx="1" fill="#22c55e"/>
  </g>
  <text x="414" y="232" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">phone1</text>

  <!-- object 2 -->
  <g transform="translate(456,170) rotate(5)" filter="url(#glow)">
    <rect width="74" height="142" rx="14" fill="#e9edf5" stroke="#cfd8ee" stroke-width="1.6"/>
    <rect x="6" y="8" width="62" height="126" rx="10" fill="url(#scrB)"/>
    <rect x="29" y="12" width="16" height="4" rx="2" fill="#b9c0d0"/>
    <text x="37" y="70" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="Segoe UI,sans-serif">9:41</text>
    <rect x="42" y="22" width="20" height="8" rx="2" fill="none" stroke="#e7ecff" stroke-width="1"/>
    <rect x="43.5" y="23.5" width="17" height="5" rx="1" fill="#22c55e"/>
  </g>
  <text x="488" y="340" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">phone2</text>

  <text x="46" y="52" fill="#93c5fd" font-size="13" letter-spacing="2" opacity=".85">class  →  objects</text>
</svg>
