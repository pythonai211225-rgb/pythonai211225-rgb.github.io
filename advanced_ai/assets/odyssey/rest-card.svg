<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Courier New',monospace">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#1a2a5e"/><stop offset=".55" stop-color="#0d1838"/><stop offset="1" stop-color="#070d22"/>
    </radialGradient>
    <linearGradient id="neb" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0"/><stop offset=".5" stop-color="#7c4dff" stop-opacity=".22"/><stop offset="1" stop-color="#3fa9ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="link" x1="0" x2="1"><stop offset="0" stop-color="#4fd1ff"/><stop offset="1" stop-color="#b47cff"/></linearGradient>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b4fa8"/><stop offset="1" stop-color="#14245a"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>
  <path d="M-40 360 C 140 250, 300 260, 640 40" stroke="url(#neb)" stroke-width="130" fill="none"/>
  <g fill="#cfe6ff" opacity=".75">
    <circle cx="42" cy="38" r="1.2"/><circle cx="120" cy="80" r=".8"/><circle cx="210" cy="30" r="1"/><circle cx="330" cy="58" r="1.3"/>
    <circle cx="455" cy="26" r=".9"/><circle cx="560" cy="70" r="1.1"/><circle cx="70" cy="330" r="1"/><circle cx="180" cy="372" r=".8"/>
    <circle cx="300" cy="345" r="1.2"/><circle cx="420" cy="380" r=".9"/><circle cx="548" cy="330" r="1.3"/><circle cx="25" cy="190" r=".9"/>
    <circle cx="585" cy="200" r="1"/><circle cx="260" cy="110" r=".7"/><circle cx="390" cy="300" r=".8"/><circle cx="505" cy="140" r=".7"/>
  </g>
  <g stroke="#2a4a8a" stroke-width="1" fill="none" opacity=".45">
    <path d="M0 300 H40 L60 280 H110"/><path d="M600 110 H560 L540 90 H500"/><path d="M600 300 H570 L555 315 H520"/>
  </g>

  <!-- client: laptop -->
  <g filter="url(#glow)" stroke="#4fd1ff" stroke-width="3" fill="none" stroke-linejoin="round">
    <rect x="48" y="150" width="112" height="76" rx="7" fill="#0f2350"/>
    <path d="M34 238 H174 L162 226 H46 Z" fill="#0f2350"/>
  </g>
  <g fill="#4fd1ff" opacity=".85">
    <rect x="62" y="166" width="54" height="6" rx="3"/><rect x="62" y="180" width="80" height="6" rx="3" opacity=".7"/><rect x="62" y="194" width="66" height="6" rx="3" opacity=".55"/><rect x="62" y="208" width="40" height="6" rx="3" opacity=".4"/>
  </g>

  <!-- API: braces -->
  <g filter="url(#glow)">
    <rect x="232" y="140" width="136" height="110" rx="18" fill="#1c1446" stroke="#b47cff" stroke-width="3"/>
    <text x="300" y="214" text-anchor="middle" font-size="62" font-weight="700" fill="#e3cfff">{ }</text>
  </g>
  <text x="300" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#c9b3ff" letter-spacing="3">API</text>

  <!-- database -->
  <g filter="url(#glow)" stroke="#ffcf6b" stroke-width="3">
    <path d="M440 158 V232 A56 15 0 0 0 552 232 V158" fill="url(#dbg)"/>
    <path d="M440 183 A56 15 0 0 0 552 183 M440 208 A56 15 0 0 0 552 208" fill="none" opacity=".8"/>
    <ellipse cx="496" cy="158" rx="56" ry="15" fill="#2d58b8"/>
  </g>

  <!-- links -->
  <g stroke="url(#link)" stroke-width="2.5" fill="none" filter="url(#soft)">
    <path d="M176 182 H226"/><path d="M226 210 H176"/><path d="M374 182 H434"/><path d="M434 210 H374"/>
  </g>
  <g stroke="url(#link)" stroke-width="2.5" fill="none">
    <path d="M176 182 H226"/><path d="M226 210 H176"/><path d="M374 182 H434"/><path d="M434 210 H374"/>
  </g>
  <g fill="#9fdcff"><path d="M226 177 L234 182 L226 187 Z"/><path d="M176 205 L168 210 L176 215 Z"/><path d="M434 177 L442 182 L434 187 Z"/><path d="M374 205 L366 210 L374 215 Z"/></g>
  <circle cx="200" cy="182" r="4" fill="#fff" filter="url(#glow)"/>
  <circle cx="408" cy="210" r="4" fill="#ffcf6b" filter="url(#glow)"/>

  <!-- method chips -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <g filter="url(#glow)"><rect x="96" y="62" width="74" height="30" rx="15" fill="#0e2a52" stroke="#61affe" stroke-width="2"/></g>
    <text x="133" y="82" fill="#9fd0ff">GET</text>
    <g filter="url(#glow)"><rect x="196" y="40" width="84" height="30" rx="15" fill="#0d3a2e" stroke="#49cc90" stroke-width="2"/></g>
    <text x="238" y="60" fill="#9df0c6">POST</text>
    <g filter="url(#glow)"><rect x="318" y="40" width="74" height="30" rx="15" fill="#3f2a08" stroke="#fca130" stroke-width="2"/></g>
    <text x="355" y="60" fill="#ffd08a">PUT</text>
    <g filter="url(#glow)"><rect x="420" y="62" width="100" height="30" rx="15" fill="#3e0f18" stroke="#f93e3e" stroke-width="2"/></g>
    <text x="470" y="82" fill="#ffaaaa">DELETE</text>
  </g>

  <!-- status line -->
  <g font-size="13" fill="#7fe0b0" filter="url(#soft)" opacity=".6"><text x="300" y="330" text-anchor="middle">200 OK · 201 Created · 204 No Content</text></g>
  <text x="300" y="330" text-anchor="middle" font-size="13" fill="#9df0c6">200 OK · 201 Created · 204 No Content</text>
</svg>
